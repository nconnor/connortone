<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">

<!-- Google Fonts: Archivo (600,700) + Source Sans 3 (400,600), display=swap -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<!-- Stylesheet (SCSS compiled by Jekyll) -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- OpenGraph / SEO -->
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/connortone-logo.png' | absolute_url }}">
