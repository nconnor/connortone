<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">

<!-- Jost via Bunny Fonts (fonts.bunny.net, no Google dependency), display=swap -->
<!-- Per design-spec.md §7: one webfont only, weights 400/500/600 -->
<link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
<link href="https://fonts.bunny.net/css?family=jost:400,500,600" rel="stylesheet">

<!-- Stylesheet (SCSS compiled by Jekyll) -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- OpenGraph / SEO -->
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/connortone-logo.png' | absolute_url }}">
