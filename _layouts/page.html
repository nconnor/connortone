---
layout: default
---
<article class="page page-{{ page.url | slugify }}" aria-label="{{ page.title }}">
  <header class="page-header">
    <div class="container">
      <h1 class="page-title">{{ page.title }}</h1>
    </div>
  </header>

  <div class="page-content">
    <div class="container">
      <div class="grid-12">
        <div class="col-content column-prose measure">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</article>
